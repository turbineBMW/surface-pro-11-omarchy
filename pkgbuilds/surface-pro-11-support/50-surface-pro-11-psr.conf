# Surface Pro 11: panel self-refresh (PSR1) on the internal OLED panel.
# msm keeps PSR behind msm.psr_enabled, off by default. On this panel it
# saves about 0.7 W on a still screen (4.62 W to 3.92 W, battery, 120 Hz).
# To switch it off, add KERNEL_CMDLINE[default]+=" msm.psr_enabled=0" in
# /etc/limine-entry-tool.d/ (read after this file) and run limine-update.
KERNEL_CMDLINE[default]+=" msm.psr_enabled=1"
