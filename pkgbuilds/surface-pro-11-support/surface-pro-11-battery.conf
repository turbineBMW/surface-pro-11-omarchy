# Surface Pro 11: one battery, not two.
#
# The Qualcomm battery manager (qcom_battmgr) provides the battery and the
# chargers, with the charge limit and the cell temperature. The Surface
# Aggregator also offers the same battery (surface_battery, BAT1) and charger
# (surface_charger, ADP1). UPower sums the two into one display battery, and
# SAM's battery answers slowly at boot, so the bar showed 100 % while the
# card showed 74 %. Keep the one that carries the charge limit.
# Lost with SAM's battery: its charge cycle count, which the battery manager
# does not report on this firmware.
blacklist surface_battery
blacklist surface_charger
