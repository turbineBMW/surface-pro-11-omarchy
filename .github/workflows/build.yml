name: Build and publish

on:
  push:
    branches: [main]
    paths: ['pkgbuilds/**', 'bin/**', 'creator/**', 'iso/firmware-files.txt', 'omarchy-recipe.json', '.github/workflows/build.yml']
  workflow_dispatch:
  schedule:
    # Daily: has Omarchy caught up with a package carried here?
    - cron: '17 9 * * *'

permissions:
  contents: write

# One publish at a time: each run rewrites the repository database.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # Only a public repository can serve pacman (anonymous release downloads)
    # and run on GitHub's free arm64 runners.
    if: github.event_name != 'schedule' && !github.event.repository.private
    runs-on: ubuntu-24.04-arm
    # The kernel takes most of this on a 4-core runner.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/publish fetch

      # Omarchy's own builder image, keyed by its build inputs: packages here
      # are built exactly the way Omarchy builds its own.
      - name: Pick Omarchy's builder image
        id: image
        run: |
          git clone --depth 1 https://github.com/omacom/omarchy-pkgs "$RUNNER_TEMP/omarchy-pkgs"
          key=$("$RUNNER_TEMP/omarchy-pkgs/bin/builder-image" key --arch aarch64 --mirror edge)
          echo "ref=ghcr.io/omacom/omarchy-pkg-builder:$key" >>"$GITHUB_OUTPUT"

      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGN_KEY: ${{ vars.SIGN_KEY }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm -v "$PWD:/repo" -e SIGNING_KEY -e SIGN_KEY -e INSTALL_MAKEDEPENDS=1 \
            "$IMAGE" bash -c '
              set -euo pipefail
              sudo chown -R builder: /repo
              printf "\n[omarchy]\nServer = https://pkgs.omarchy.org/edge/\$arch\n" | sudo tee -a /etc/pacman.conf >/dev/null
              sudo sed -i "s|^PACKAGER=.*|PACKAGER=\"Brandon Williams <turbine.bmw@gmail.com>\"|" /etc/makepkg.conf
              sudo pacman -Syu --noconfirm
              if [[ -n $SIGNING_KEY ]]; then
                printf "%s\n" "$SIGNING_KEY" | gpg --batch --import
              else
                unset SIGN_KEY
                echo "::warning::No SIGNING_KEY secret: building unsigned, nothing will be published"
              fi
              cd /repo && bin/build'

      # The container builds as its own user; give the checkout back even
      # when the build fails, or the job's cleanup cannot touch .git.
      - name: Give the checkout back
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .

      # The signed repository, for the publish job: a failed publish can be
      # re-run on its own without building the kernel again.
      - name: Keep the repository for publishing
        if: vars.SIGN_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: repository-aarch64
          path: out/aarch64/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: vars.SIGN_KEY != '' && github.event_name != 'schedule' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: repository-aarch64
          path: out/aarch64
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: aarch64
        run: bin/publish upload

  creator:
    # The Windows USB creator: a self-contained win-arm64 executable,
    # cross-built on Linux.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish
        run: dotnet publish creator -c Release -r win-arm64 --self-contained true -o out/creator
      - uses: actions/upload-artifact@v4
        with:
          name: SurfaceUsbCreator-win-arm64
          path: out/creator/SurfaceUsbCreator.exe

  upstream:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Compare with Omarchy edge
        run: |
          git clone --depth 1 https://github.com/omacom/omarchy-pkgs "$RUNNER_TEMP/omarchy-pkgs"
          image=ghcr.io/omacom/omarchy-pkg-builder:$("$RUNNER_TEMP/omarchy-pkgs/bin/builder-image" key --arch aarch64 --mirror edge)
          # Fails when a package has caught up, so the maintainer is told.
          docker run --rm -v "$PWD:/repo:ro" "$image" bash -c 'cd /repo && bin/check-upstream edge'
