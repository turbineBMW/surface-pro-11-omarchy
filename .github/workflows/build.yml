name: Build and publish

on:
  push:
    branches: [main]
    paths: ['pkgbuilds/**', 'bin/**', '.github/workflows/build.yml']
  workflow_dispatch:
  schedule:
    # Daily: has Omarchy caught up with a package carried here?
    - cron: '17 9 * * *'

permissions:
  contents: write

# One publish at a time: each run rewrites the repository database.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04-arm
    # The kernel takes most of this on a 4-core runner.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the published database
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/publish fetch

      # Omarchy's own builder image, keyed by its build inputs: packages here
      # are built exactly the way Omarchy builds its own.
      - name: Pick Omarchy's builder image
        id: image
        run: |
          git clone --depth 1 https://github.com/omacom/omarchy-pkgs "$RUNNER_TEMP/omarchy-pkgs"
          key=$("$RUNNER_TEMP/omarchy-pkgs/bin/builder-image" key --arch aarch64 --mirror edge)
          echo "ref=ghcr.io/omacom/omarchy-pkg-builder:$key" >>"$GITHUB_OUTPUT"

      - name: Build
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGN_KEY: ${{ vars.SIGN_KEY }}
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker run --rm -v "$PWD:/repo" -e SIGNING_KEY -e SIGN_KEY -e INSTALL_MAKEDEPENDS=1 \
            "$IMAGE" bash -c '
              set -euo pipefail
              sudo chown -R builder: /repo
              printf "\n[omarchy]\nServer = https://pkgs.omarchy.org/edge/\$arch\n" | sudo tee -a /etc/pacman.conf >/dev/null
              sudo sed -i "s|^PACKAGER=.*|PACKAGER=\"Brandon Williams <turbine.bmw@gmail.com>\"|" /etc/makepkg.conf
              sudo pacman -Syu --noconfirm
              if [[ -n $SIGNING_KEY ]]; then
                printf "%s\n" "$SIGNING_KEY" | gpg --batch --import
              else
                unset SIGN_KEY
                echo "::warning::No SIGNING_KEY secret: building unsigned, nothing will be published"
              fi
              cd /repo && bin/build'
          sudo chown -R "$(id -u):$(id -g)" .

      - name: Publish
        if: vars.SIGN_KEY != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/publish upload

  upstream:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Compare with Omarchy edge
        run: |
          git clone --depth 1 https://github.com/omacom/omarchy-pkgs "$RUNNER_TEMP/omarchy-pkgs"
          image=ghcr.io/omacom/omarchy-pkg-builder:$("$RUNNER_TEMP/omarchy-pkgs/bin/builder-image" key --arch aarch64 --mirror edge)
          # Fails when a package has caught up, so the maintainer is told.
          docker run --rm -v "$PWD:/repo:ro" "$image" bash -c 'cd /repo && bin/check-upstream edge'
